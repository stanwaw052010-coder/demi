# Netlify: цей репозиторій містить ДВА проєкти.
# У корені — інший сайт (магазин, Next.js), а сайт-портфоліо лежить у папці portfolio/.
# Ці налаштування кажуть Netlify публікувати саме портфоліо як статичний сайт.
#
# base = "portfolio"  -> Netlify заходить у папку portfolio і бачить простий
#                        статичний сайт (там немає package.json), тому нічого не збирає.
# publish = "."       -> публікує вміст papки portfolio (index.html у корені сайту).
# command = ""        -> без збірки.

[build]
  base = "portfolio"
  publish = "."
  command = ""
